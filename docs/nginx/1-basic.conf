worker_processes auto;

events {
	worker_connections 256;
}

http {

     # map file types to content type
     include /opt/homebrew/etc/nginx/mime.types;
     
	 # enable compression
	 gzip on;
     gzip_comp_level 3;
     gzip_types text/css text/javascript;
     
	 server {
     	listen 9091;
	    server_name nginx-handbook.test;

	    #prefix match
	    location /agatha {
            	     return 200 "Miss Marple.\nHercule Poirot.\n";
            }

	    #exact match
	    location = /jwn {
	    	     return 200 "Discovery of India.\n";
	    }

	    #regex match, works for number at end and is case insensitive due to *
	    location ~* /danbrown[0-9] {
	    	     return 200 "Angels and Daemons!!\n";
	    }

	    # preferential prefix match
	    location ^~ /DanBrown8 {
        	     return 200 "prefix matched.\n";
            }

	    #variables
	    location /vars {
	    	     return 200 "Host - $host\nURI - $uri\nArgs - $args";
	    }
     }
     server {
     	listen 9092;
	    server_name nginx-handbook.test;

		error_log /opt/homebrew/var/log/nginx/error.log info;

	    # static content from this dir
	    root /Users/d066419/go/src/github.com/fhsinchy/nginx-handbook-projects/static-demo;

		# caching static content
		location ~* \.(css|js|jpg)$ {
            access_log off;
            
            add_header Cache-Control public;
            add_header Pragma public;
            add_header Vary Accept-Encoding;
            expires 1M;
        }

	    location = /index_page {
            	     return 307 /index.html;
        }

	    rewrite /about_page /about.html;

	    try_files $uri $uri/ /not_found;

	    location /not_found {
	    	     return 404 "nothing here!!\n";
	    }

		#no logging
		location = /no_logging {
            access_log off;
            
            return 200 "this will not be logged.\n";
        }

		#loggin in a separate file
		location = /admin {
            access_log /opt/homebrew/var/log/nginx/admin.log;
            
            return 200 "this will be logged in a separate file.\n";
        }
     }
}